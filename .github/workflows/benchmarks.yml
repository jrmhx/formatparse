name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      job:
        description: Dry checks execution; Short measures performance
        type: choice
        options: [Short, Dry]
        default: Short

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      BENCHMARK_JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet run -c Release --project benchmarks/FormatParse.Benchmarks -- --validate
      - name: Measure
        run: dotnet run -c Release --no-build --project benchmarks/FormatParse.Benchmarks -- --job "$BENCHMARK_JOB" --filter '*' --exporters json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: warn
          retention-days: 30
