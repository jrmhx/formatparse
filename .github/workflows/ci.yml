name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet restore FormatParse.slnx
      - run: dotnet build FormatParse.slnx -c Release --no-restore -warnaserror
      - run: python scripts/test_automation.py
      - name: Read package version
        id: version
        run: python scripts/release.py project-version
      - name: Test with coverage
        run: dotnet test tests/FormatParse.Tests/FormatParse.Tests.csproj -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory artifacts/tests
      - name: Check coverage
        run: python scripts/coverage.py artifacts/tests
      - name: Check benchmark equivalence
        run: dotnet run -c Release --no-build --project benchmarks/FormatParse.Benchmarks -- --validate
      - name: Check examples
        run: dotnet run -c Release --no-build --project examples/FormatParse.Example
      - name: Pack
        run: dotnet pack src/FormatParse/FormatParse.csproj -c Release --no-build --no-restore -o artifacts/packages
      - name: Inspect package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py package "artifacts/packages/FormatParse.$VERSION.nupkg" "$VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
