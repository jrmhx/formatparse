name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Must exactly match the Environment configured
    # in the nuget.org Trusted Publishing policy.
    environment: production

    permissions:
      contents: write
      id-token: write

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Validate version
        id: version
        run: python scripts/release.py version "$RELEASE_TAG"

      - run: dotnet restore FormatParse.slnx

      - run: >
          dotnet build FormatParse.slnx
          -c Release
          --no-restore
          -warnaserror
          -p:ContinuousIntegrationBuild=true

      - run: python scripts/test_automation.py

      - name: Test with coverage
        run: >
          dotnet test tests/FormatParse.Tests/FormatParse.Tests.csproj
          -c Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/tests

      - run: python scripts/coverage.py artifacts/tests

      - run: >
          dotnet run
          -c Release
          --no-build
          --project benchmarks/FormatParse.Benchmarks
          --
          --validate

      - name: Pack and inspect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/FormatParse/FormatParse.csproj \
            -c Release \
            --no-build \
            --no-restore \
            -o artifacts/packages \
            -p:PackageVersion="$VERSION"

          python scripts/release.py \
            package \
            "artifacts/packages/FormatParse.$VERSION.nupkg" \
            "$VERSION"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-validation
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --generate-notes --title "$RELEASE_TAG")

            if [[ "$PRERELEASE" == "true" ]]; then
              flags+=(--prerelease)
            fi

            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi

          gh release upload \
            "$RELEASE_TAG" \
            "artifacts/packages/FormatParse.$VERSION.nupkg" \
            --clobber

      # Exchange the GitHub OIDC token for a short-lived
      # NuGet.org API key.
      - name: Login to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet nuget push
          "artifacts/packages/FormatParse.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false